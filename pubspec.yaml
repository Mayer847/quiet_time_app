name: quiet_time_app
description: "A daily Bible reading schedule."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/qt_schedule.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/quiet_time_app.png"
  min_sdk_android: 21 # You can set your minimum Android SDK here
